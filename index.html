<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xuân Đinh Mùi</title>
    <link rel="icon" type="image/png" href="assets/icon.png">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
</head>

<body>
    <canvas id="fireworks" class="fireworks" aria-hidden="true"></canvas>
    <button id="sound-toggle" class="sound-toggle" type="button" aria-pressed="false" aria-label="Bật tiếng">
        <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9.5l5 5M21 9.5l-5 5"/>
        </svg>
        <svg class="icon-on" viewBox="0 0 24 24" aria-hidden="true">
            <path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/>
            <path fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" d="M16 9a4 4 0 010 6M18.5 7a7 7 0 010 10"/>
        </svg>
    </button>
    <div id="youtube-player" class="youtube-player"></div>
    <div class="text montserrat-font ephesis-regular">Xuân Đinh Mùi</div>
    <div id="countdown" class="countdown jaro-font">
        <div class="countdown-box ">
            <div class="day time-box ">
                <div id="days-num"></div>
            </div>
            <div class="days-text time-unit">ngày</div>
        </div>
        <div class="countdown-box">
            <div class="hour time-box ">
                <div id="hours-num"></div>
            </div>
            <div class="hours-text time-unit">giờ</div>
        </div>
        <div class="countdown-box">
            <div class="minute time-box ">
                <div id="minutes-num"></div>
            </div>
            <div class="minutes-text time-unit">phút</div>
        </div>
        <div class="countdown-box">
            <div class="second time-box ">
                <div id="seconds-num"></div>
            </div>
            <div class="seconds-text time-unit">giây</div>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>

</html>
